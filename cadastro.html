<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Reflex ADS</title>
  <link rel="stylesheet" href="src/style.css" />
  <style>
    body {
      min-height: 100vh;
      background: var(--grad-login);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .topo {
      font-family: 'Syne', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      margin: 2rem 0 1.5rem;
    }
    .topo span { color: var(--amarelo); }

    .card-auth {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,.25);
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      margin-bottom: 2rem;
    }
    .card-auth h2 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
      margin-bottom: .5rem;
      font-family: 'Syne', sans-serif;
    }
    .card-auth h2::after {
      content: '';
      display: block;
      width: 60px; height: 4px;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      margin: .5rem auto 1.5rem;
      border-radius: 2px;
    }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; margin-bottom: .4rem; font-weight: 600; color: #555; font-size: .875rem; }
    .form-group input {
      width: 100%; padding: .7rem 1rem;
      border: 2px solid #e1e1e1; border-radius: 8px;
      font-size: .95rem; font-family: inherit;
      background: #f9f9f9; transition: all .25s;
    }
    .form-group input:focus {
      border-color: #6a11cb; background: #fff;
      box-shadow: 0 0 0 3px rgba(106,17,203,.1); outline: none;
    }
    .form-group input.invalido { border-color: #dc2626; }
    .form-group input.valido { border-color: #16a34a; }

    /* Tipo de usuário */
    .tipo-usuario { display: flex; gap: .75rem; }
    .btn-tipo {
      flex: 1; padding: .75rem;
      background: #f0f0f0; color: #555;
      border: 2px solid #e1e1e1; border-radius: 8px;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .2s;
    }
    .btn-tipo.ativo {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: #fff; border-color: transparent;
    }

    /* Força de senha */
    .forca-senha { height: 4px; background: #e1e1e1; border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .forca-barra { height: 100%; width: 0; transition: all .3s; }

    .msg-erro {
      background: #fee2e2; border: 1px solid #fca5a5;
      color: #dc2626; border-radius: 8px; padding: .75rem 1rem;
      font-size: .875rem; margin-bottom: 1rem; display: none;
    }
    .msg-erro.visivel { display: block; }

    .btn-row { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .btn-registrar {
      flex: 1; padding: .8rem;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: #fff; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all .2s;
    }
    .btn-registrar:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(106,17,203,.4); }
    .btn-registrar:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-login-link {
      flex: 1; padding: .8rem;
      background: #f0f0f0; color: #555;
      border: 2px solid #e1e1e1; border-radius: 8px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .btn-login-link:hover { background: #e5e5e5; }

    footer { width: 100%; }
  </style>
</head>
<body>

<div class="toast-container" id="toasts"></div>

<h1 class="topo">Reflex <span>ADS</span></h1>

<div class="card-auth">
  <h2>Cadastro</h2>

  <div class="msg-erro" id="erro"></div>

  <div class="form-group">
    <label>Deseja se cadastrar como?</label>
    <div class="tipo-usuario">
      <button class="btn-tipo" id="btnAluno" onclick="setTipo('A')">🎓 Aluno</button>
      <button class="btn-tipo ativo" id="btnProf" onclick="setTipo('P')">👨‍🏫 Professor</button>
    </div>
  </div>

  <div class="form-group">
    <label for="fullname">Nome completo</label>
    <input type="text" id="fullname" placeholder="Digite seu nome completo" />
  </div>

  <div class="form-group">
    <label for="username">Nome de usuário</label>
    <input type="text" id="username" placeholder="Escolha um nome de usuário" />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="seu.email@exemplo.com" />
  </div>

  <div class="form-group">
    <label for="telephone">Telefone</label>
    <input type="tel" id="telephone" placeholder="(00) 00000-0000" maxlength="15" />
  </div>

  <div class="form-group">
    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="Mín. 8 caracteres, maiúscula, número" oninput="verificarForca(this.value)" />
    <div class="forca-senha"><div class="forca-barra" id="forcaBarra"></div></div>
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirmar senha</label>
    <input type="password" id="confirmPassword" placeholder="Digite novamente" oninput="verificarConfirmacao()" />
  </div>

  <div class="btn-row">
    <button class="btn-registrar" id="btnRegistrar" onclick="registrar()">Criar Conta</button>
    <a class="btn-login-link" href="login.html">Já tenho conta</a>
  </div>
</div>

<footer class="rodape">
  <div class="container">
    <div class="rodape-conteudo">
      <div class="rodape-coluna"><h3>Reflex ADS</h3><p>Democratizando o ensino de tecnologia para escolas públicas.</p></div>
      <div class="rodape-coluna"><h3>Contato</h3><p>contato@reflex.edu.br</p></div>
      <div class="rodape-coluna"><h3>Parceiros</h3><p>Secretaria da Educação</p></div>
    </div>
    <div class="rodape-copyright"><p>© 2025 Reflex ADS - Todos os direitos reservados.</p></div>
  </div>
</footer>

<script>
  const API = 'http://localhost:8000';
  let tipoUsuario = 'A'; // default aluno (botão aluno clicado)

  // Inicializa com Aluno selecionado
  document.addEventListener('DOMContentLoaded', () => setTipo('A'));

  function setTipo(tipo) {
    tipoUsuario = tipo;
    document.getElementById('btnAluno').classList.toggle('ativo', tipo === 'A');
    document.getElementById('btnProf').classList.toggle('ativo', tipo === 'P');
  }

  // Máscara de telefone
  document.getElementById('telephone').addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '');
    if (v.length >= 11) v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
    else if (v.length >= 7) v = v.replace(/^(\d{2})(\d{4})(\d*)/, '($1) $2-$3');
    else if (v.length >= 3) v = v.replace(/^(\d{2})(\d*)/, '($1) $2');
    this.value = v;
  });

  function verificarForca(senha) {
    const barra = document.getElementById('forcaBarra');
    let forca = 0;
    if (senha.length >= 8) forca++;
    if (/[A-Z]/.test(senha)) forca++;
    if (/[a-z]/.test(senha)) forca++;
    if (/\d/.test(senha)) forca++;

    const pct = (forca / 4) * 100;
    barra.style.width = pct + '%';
    barra.style.backgroundColor = forca <= 1 ? '#dc2626' : forca <= 2 ? '#f97316' : forca <= 3 ? '#fde047' : '#16a34a';
  }

  function verificarConfirmacao() {
    const p = document.getElementById('password').value;
    const c = document.getElementById('confirmPassword');
    c.classList.toggle('valido', c.value === p && p !== '');
    c.classList.toggle('invalido', c.value !== p && c.value !== '');
  }

  async function registrar() {
    const fullname = document.getElementById('fullname').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const telephone = document.getElementById('telephone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('btnRegistrar');
    const erro = document.getElementById('erro');

    erro.classList.remove('visivel');

    if (!fullname || !username || !email || !password) {
      mostrarErro('Preencha todos os campos obrigatórios.');
      return;
    }
    if (password !== confirmPassword) {
      mostrarErro('As senhas não coincidem.');
      return;
    }
    if (password.length < 8 || !/[A-Z]/.test(password) || !/\d/.test(password)) {
      mostrarErro('Senha fraca: use no mínimo 8 caracteres, uma letra maiúscula e um número.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Criando conta...';

    try {
      const payload = {
        username,
        password,
        email,
        fullname,
        telephone: telephone || '(00) 00000-0000',
        type_user: tipoUsuario
      };

      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (!res.ok) {
        mostrarErro(data.detail || 'Erro ao criar conta. Tente novamente.');
        return;
      }

      toast('Conta criada com sucesso! Faça login.', 'sucesso');
      setTimeout(() => window.location.href = 'login.html', 1500);

    } catch (e) {
      mostrarErro('Não foi possível conectar à API. Verifique se o servidor está em localhost:8000.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Criar Conta';
    }
  }

  function mostrarErro(msg) {
    const el = document.getElementById('erro');
    el.textContent = msg;
    el.classList.add('visivel');
  }

  function toast(msg, tipo = 'sucesso') {
    const t = document.createElement('div');
    t.className = `toast ${tipo}`;
    t.textContent = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Reflex ADS</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- Header igual -->

  <div class="container" style="padding: 3rem 1.5rem; max-width: 800px; margin: 0 auto;">
    <div class="cartao">
      <h2>Meu Perfil</h2>
      <p><strong>Usuário:</strong> <span id="username-perfil"></span></p>
      <p><strong>Tipo:</strong> Aluno/Professor</p>
      
      <h3 style="margin-top:2rem;">Progresso Geral</h3>
      <div style="background:#f0f0f0; height:12px; border-radius:9999px; margin:1rem 0;">
        <div style="width:45%; height:100%; background:var(--azul);"></div>
      </div>
      <p>45% completo • 2 módulos + 5 aulas concluídas</p>
    </div>
  </div>

  <script>
    const username = localStorage.getItem('username');
    document.getElementById('username-perfil').textContent = username || 'Aluno';

    // Aqui você pode adicionar chamadas para completar módulo/aula no futuro
  </script>
</body>
</html>

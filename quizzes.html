<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzes - Reflex ADS</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- Header igual ao de conteudos.html (copie e cole) -->

  <div class="heroi">
    <div class="container">
      <h1 class="titulo-heroi">Quizzes Interativos</h1>
      <p class="descricao-heroi">Teste seus conhecimentos e acompanhe seu progresso</p>
    </div>
  </div>

  <div class="container" style="padding: 3rem 1.5rem;">
    <h2 style="text-align:center; margin-bottom:2rem;">Quizzes Disponíveis</h2>
    <div id="quizzes-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;"></div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script>
    // ... mesmo header + token check ...

    async function carregarQuizzes() {
      try {
        // Por enquanto lista lessons de tipo Q (quiz) ou usa /lessons/
        const res = await fetch(`${API}/lessons/`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const lessons = await res.json();

        const container = document.getElementById('quizzes-list');
        container.innerHTML = '';

        lessons.filter(l => l.content_type === 'Q').forEach(quiz => {
          const card = document.createElement('div');
          card.className = 'cartao';
          card.innerHTML = `
            <h3>Quiz: ${quiz.title}</h3>
            <p>Aula ID: ${quiz.id}</p>
            <button onclick="iniciarQuiz(${quiz.id})" class="botao-primario" style="margin-top:1rem; width:100%;">Iniciar Quiz</button>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        toast('Erro ao carregar quizzes.', 'erro');
      }
    }

    async function iniciarQuiz(lesson_id) {
      toast(`Iniciando quiz da aula ${lesson_id}... (implementar get_quiz_questions no futuro)`, 'sucesso');
      // Futuro: chamar endpoint de perguntas do quiz
    }

    window.onload = carregarQuizzes;
  </script>
</body>
</html>

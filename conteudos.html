<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conteúdos - Reflex ADS</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header class="cabecalho">
    <div class="container-navegacao">
      <div class="logo">Reflex <span>ADS</span></div>
      <nav>
        <ul class="menu-navegacao">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="conteudos.html" class="ativo">Conteúdos</a></li>
          <li><a href="quizzes.html">Quizzes</a></li>
          <li><a href="perfil.html">Perfil</a></li>
        </ul>
      </nav>
      <div>
        <span id="user-name" style="margin-right:15px; font-weight:600;"></span>
        <button onclick="logout()" style="padding:0.5rem 1rem; background:#f0f0f0; border:none; border-radius:8px; cursor:pointer;">Sair</button>
      </div>
    </div>
  </header>

  <div class="heroi">
    <div class="container">
      <h1 class="titulo-heroi">Explorar Conteúdos</h1>
      <p class="descricao-heroi">Materiais interativos de Lógica, Matemática e Ciências da Computação</p>
    </div>
  </div>

  <div class="container" style="padding: 3rem 1.5rem;">
    <div id="modulos-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;"></div>
  </div>

  <footer class="rodape">...</footer> <!-- mesmo footer das outras páginas -->

  <div class="toast-container" id="toasts"></div>

  <script>
    const API = 'http://localhost:8000';
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');

    if (!token) window.location.href = 'login.html';

    document.getElementById('user-name').textContent = username || 'Aluno';

    async function carregarConteudos() {
      try {
        // Lista módulos (ou lessons se preferir)
        const res = await fetch(`${API}/modules/`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error();
        const modulos = await res.json();

        const container = document.getElementById('modulos-list');
        container.innerHTML = '';

        modulos.forEach(m => {
          const card = document.createElement('div');
          card.className = 'cartao';
          card.innerHTML = `
            <h3>${m.title}</h3>
            <p>Módulo do curso ID: ${m.course_id}</p>
            <button onclick="verAulas(${m.id})" class="botao-primario" style="margin-top:1rem; width:100%;">Ver Aulas</button>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        toast('Erro ao carregar conteúdos. Verifique se a API está rodando.', 'erro');
      }
    }

    async function verAulas(module_id) {
      toast(`Carregando aulas do módulo ${module_id}... (próxima etapa)`, 'sucesso');
      // Aqui você pode redirecionar ou carregar lessons em modal/futura página
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function toast(msg, tipo = 'sucesso') {
      const t = document.createElement('div');
      t.className = `toast ${tipo}`;
      t.textContent = msg;
      document.getElementById('toasts').appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    window.onload = carregarConteudos;
  </script>
</body>
</html>
